<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{
  --teal:#234F5F; --teal2:#2F6577; --orange:#F4A640; --orange2:#E8952A; --peach:#FDEBD8; --peach2:#F9DDBF;
  --bg:#F2F5F6; --card:#FFFFFF; --ink:#1F3B47; --muted:#7F919B; --line:#E4EAED; --red:#E2574C; --green:#3FA37C; --blue:#3E7CB1;
  --r:22px; --shadow:0 10px 30px rgba(35,79,95,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 Poppins,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange2);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}
#app{max-width:1080px;margin:0 auto;padding:22px 18px calc(120px + env(safe-area-inset-bottom,0px))}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.top h1{font:600 26px/1.25 Poppins,sans-serif;margin:0}
.top h1.plain{max-width:none;font-size:24px}
.top h1 em{font-style:normal;color:var(--orange2)}
.top p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
.greet{margin-bottom:10px}
.greet .hi{font-weight:600;font-size:17px;color:var(--teal);display:flex;gap:8px;align-items:center}
.greet p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.brief{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.gl{border:0;background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink);box-shadow:0 2px 8px rgba(35,79,95,.07)}
.gl b{color:var(--orange2);font-weight:700}
.clocks{display:flex;gap:12px;flex-wrap:wrap}
.clk{background:var(--card);border-radius:20px;padding:12px 18px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;min-width:150px}
.clk small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.clk .dg{font-family:Orbitron,"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-weight:800;color:var(--teal);display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums;line-height:1.15}
.clk .hm{font-size:30px;letter-spacing:.04em}.clk .ss{font-size:14px;font-weight:600;color:var(--orange2);min-width:2ch}
.clk .dt{font-size:11.5px;color:var(--muted)}
.clk.mine{background:var(--teal)}.clk.mine small,.clk.mine .dt{color:rgba(255,255,255,.72)}.clk.mine .dg{color:#fff}.clk.mine .ss{color:var(--orange)}
.rv{border:2px solid var(--orange)}
.panel .gl{background:var(--bg);box-shadow:none}
.tm{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.tm div{display:flex;flex-direction:column}.tmd{font:800 24px/1.1 Orbitron,"SF Mono",ui-monospace,Menlo,monospace;color:var(--teal);font-variant-numeric:tabular-nums}
.tm small{font-size:11.5px;color:var(--muted)}
.fl{flex:1;min-width:0;color:var(--teal);font-weight:500;overflow-wrap:anywhere;text-decoration:none}.fl:hover{text-decoration:underline}
.filebtn{display:inline-flex;margin-top:10px;cursor:pointer}
.up.me{border-left-color:var(--red)}
.runbar{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:20px;border-left:5px solid var(--orange)}
.runbar div{flex:1;min-width:0;display:flex;flex-direction:column}.runbar small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.runbar strong{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runbar>b{font:800 20px Orbitron,"SF Mono",ui-monospace,Menlo,monospace;color:var(--teal);font-variant-numeric:tabular-nums}
.cd{background:var(--teal);color:#fff;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.cd .cdl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.cdn{display:flex;gap:10px}.cdn span{display:flex;flex-direction:column;align-items:center;min-width:54px;background:rgba(255,255,255,.1);border-radius:14px;padding:8px 4px 6px}
.cdn b{font:800 26px/1 Orbitron,"SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.cdn i{font-style:normal;font-size:10.5px;opacity:.7;margin-top:4px}
.cd small{font-size:12px;opacity:.8}.cd strong{font-weight:600}
.cd.soon{background:var(--orange2)}.cd.over{background:var(--red)}
.cd.done{background:var(--green)}.cd.none{background:var(--card);color:var(--muted);box-shadow:var(--shadow)}.cd.none strong{color:var(--ink);font-weight:500;font-size:13px}
.tools{display:flex;gap:8px;align-items:center}
.ic{position:relative;width:42px;height:42px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--teal)}
.ic .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--orange);color:#fff;font:600 11px/18px Poppins,sans-serif;padding:0 5px}
.av{width:42px;height:42px;border-radius:14px;border:0;background:var(--teal);color:#fff;font-weight:600;display:grid;place-items:center}
.banner{background:var(--peach);border-radius:14px;padding:9px 14px;font-size:12.5px;margin-bottom:14px;text-align:center}

/* cards */
.hero{position:relative;overflow:hidden;background:var(--teal);color:#fff;border-radius:var(--r);padding:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;box-shadow:0 14px 30px rgba(35,79,95,.25)}
.hero:before,.hero:after{content:"";position:absolute;border:1.5px solid rgba(255,255,255,.08);border-radius:50%}
.hero:before{width:150px;height:150px;left:-40px;top:-50px}.hero:after{width:80px;height:80px;left:-5px;top:-15px}
.hero h2{font:500 17px/1.4 Poppins,sans-serif;margin:0 0 14px;max-width:16ch;position:relative}
.hero small{display:block;opacity:.7;font-size:12px;margin:-8px 0 14px;position:relative}
.btn{border:0;border-radius:14px;background:var(--orange);color:#fff;font-weight:600;padding:11px 20px;position:relative}
.btn:hover{background:var(--orange2)}
.btn.sm{padding:8px 16px;font-size:12.5px;border-radius:12px}
.btn.teal{background:var(--teal)}.btn.teal:hover{background:var(--teal2)}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.wide{width:100%;padding:15px;border-radius:26px;font-size:15px}
.btn:disabled{opacity:.5}
.ring{flex:none;position:relative;width:84px;height:84px}
.ill{display:block;max-width:100%;height:auto}
.hart{display:flex;align-items:center;gap:18px;flex:none;position:relative}
.hero-ill{width:150px;height:150px;margin:-10px 0}
.sc-ill{position:relative;z-index:1}
.sc .tag{margin-top:6px}

.empty .ill{width:150px;height:150px;margin:0 auto 6px}
.rv-ill{width:110px;height:110px;margin:-4px auto 4px}
.banner.off{display:flex;align-items:center;gap:12px;text-align:left}.off-ill{width:52px;height:52px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:15px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.sec h3{font:600 17px Poppins,sans-serif;margin:0}
.sec span,.sec button{color:var(--muted);font-size:12.5px;background:none;border:0;padding:0}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pill{background:var(--card);border:0;border-radius:18px;padding:12px 14px;text-align:left;box-shadow:var(--shadow)}
.pill b{display:block;font:600 20px Poppins,sans-serif}.pill span{font-size:12px;color:var(--muted)}
.pill.r b{color:var(--red)}.pill.o b{color:var(--orange2)}.pill.t b{color:var(--teal)}

.sched{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sc{position:relative;overflow:hidden;border:0;text-align:left;border-radius:20px;padding:16px;background:var(--card);box-shadow:var(--shadow);min-height:104px;display:flex;flex-direction:column;gap:6px}
.sc.p{background:var(--peach);box-shadow:none}
.sc.more{background:var(--teal);color:#fff;align-items:center;justify-content:center;text-align:center}
.sc.more small{opacity:.7}
.sc strong{font-weight:600;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.sc small{font-size:11.5px;color:var(--muted)}
.sc .tag{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink);opacity:.8}
.sc:after{content:"";position:absolute;right:-22px;bottom:-22px;width:70px;height:70px;border-radius:50%;border:1.5px solid rgba(35,79,95,.07)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.empty{grid-column:1/-1;background:var(--card);border-radius:20px;padding:26px 18px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.empty b{display:block;color:var(--ink);font-weight:600;font-size:15px;margin-bottom:2px}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sb{border:0;text-align:left;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.sb strong{font-weight:600;font-size:13px;overflow-wrap:anywhere;line-height:1.3}
.sb small{color:var(--muted);font-size:11.5px}
.sb.add{background:transparent;box-shadow:none;border:1.5px dashed #C9D4D9;align-items:center;justify-content:center;color:var(--muted);min-height:92px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px}

/* tasks list */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:var(--shadow);color:var(--muted)}
.search input{flex:1;border:0;background:transparent;padding:13px 0;outline:0;min-width:0;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);border-radius:999px;padding:7px 14px;font-size:12.5px;display:inline-flex;gap:7px;align-items:center;box-shadow:0 2px 8px rgba(35,79,95,.06)}
.chip[aria-pressed=true]{background:var(--teal);color:#fff}
.chip.o[aria-pressed=true]{background:var(--orange);color:#fff}
.grp{margin-top:20px}
.grp h4{font:600 14px Poppins,sans-serif;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.grp h4 span{color:var(--muted);font-weight:400;font-size:12px}
.rows{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #C5D1D7;background:#fff;display:grid;place-items:center;color:#fff;padding:0}
.ck.on{background:var(--green);border-color:var(--green)}
.ck.w{border-color:var(--orange)}.ck.i{border-color:var(--blue)}
.rb{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.rb strong{display:block;font-weight:500;font-size:14px;overflow-wrap:anywhere;line-height:1.35}
.row.done .rb strong{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11.5px;color:var(--muted);margin-top:2px}
.meta .late{color:var(--red);font-weight:500}.meta .wait{color:var(--orange2)}.meta .hi{color:var(--red);font-weight:600}
.meta span{display:inline-flex;gap:5px;align-items:center}
.who{flex:none;width:28px;height:28px;border-radius:50%;background:var(--peach2);color:var(--teal);font:600 11px/28px Poppins,sans-serif;text-align:center}

/* calendar */
.cal{background:var(--teal);color:#fff;border-radius:26px;padding:20px 16px 22px;box-shadow:0 14px 30px rgba(35,79,95,.25);position:relative;overflow:hidden}
.cal:after{content:"";position:absolute;right:-40px;bottom:-40px;width:140px;height:140px;border-radius:50%;border:1.5px solid rgba(255,255,255,.08)}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.calh b{font-weight:500;font-size:17px}
.calh button{background:none;border:0;color:#fff;width:36px;height:36px;display:grid;place-items:center;border-radius:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:18px}
.dayb{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0;position:relative;z-index:1}
.dayb small{font-size:12px;opacity:.75}
.dayb b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px}
.dayb.sel b{background:var(--orange)}
.dayb.tod:not(.sel) b{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.dayb i{width:5px;height:5px;border-radius:50%;background:var(--orange);opacity:0}
.dayb.has i{opacity:1}
.cal .btn{z-index:1}
.tl{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px 10px;align-items:start}
.tl time{color:var(--muted);font-size:12.5px;padding-top:16px}
.tc{border:0;text-align:left;background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;width:100%}
.tc.p{background:var(--peach);box-shadow:none}
.tc.done strong{text-decoration:line-through;color:var(--muted)}
.tc strong{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.nowline{grid-column:1/-1;height:2px;background:var(--orange);border-radius:1px;position:relative;margin:4px 0}
.nowline:before{content:"";position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--orange);box-sizing:border-box}

/* insights */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.tile b{display:block;font:600 26px/1.1 Poppins,sans-serif}.tile span{font-size:12px;color:var(--muted)}
.tile.dark{background:var(--teal);color:#fff}.tile.dark span{color:rgba(255,255,255,.7)}
.panel{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;font-size:12.5px}
.hb .nm{display:flex;gap:7px;align-items:center;min-width:0}.hb .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.hb em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:18px}
.cols div{flex:1;background:var(--peach2);border-radius:6px 6px 2px 2px;min-height:3px;position:relative}
.cols div.t{background:var(--orange)}
.cols div span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--muted)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-bottom:6px}.legend span{display:inline-flex;gap:6px;align-items:center}

/* settings */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}.li div{flex:1;min-width:0}.li strong{display:block;font-weight:500;overflow-wrap:anywhere}.li small{color:var(--muted);font-size:11.5px}
.li .tagr{font-size:11px;color:var(--muted);flex:none}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}
label.f.full{grid-column:1/-1}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 13px;font-size:14px;color:var(--ink);min-width:0}
.in:focus{border-color:var(--orange);outline:0}
textarea.in{resize:vertical;min-height:70px}
.switch{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink)}
.switch input{width:20px;height:20px;accent-color:var(--orange2)}

/* nav */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 28px));background:var(--card);border-radius:28px;box-shadow:0 12px 34px rgba(35,79,95,.18);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 6px;z-index:5}
#nav button{border:0;background:none;height:48px;display:grid;place-items:center;color:#B4C0C7;position:relative}
#nav button[aria-current=page]{color:var(--teal)}
#nav button[aria-current=page]:after{content:"";position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--teal)}
#nav .fab{width:58px;height:58px;border-radius:50%;background:var(--orange);color:#fff;margin:-20px auto 0;box-shadow:0 0 0 6px var(--card),0 0 0 7.5px var(--orange),0 10px 20px rgba(244,166,64,.4)}

/* sheet */
#ov{position:fixed;inset:0;background:rgba(31,59,71,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sh{background:var(--bg);width:min(580px,100%);max-height:93vh;max-height:93dvh;overscroll-behavior:contain;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.shh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shh h2{font:600 19px Poppins,sans-serif;margin:0}
.x{width:38px;height:38px;border-radius:12px;border:0;background:var(--card);display:grid;place-items:center;color:var(--muted);flex:none}
.title-in{border:0;background:var(--card);border-radius:16px;padding:14px 16px;font-weight:500;font-size:16px;width:100%;box-shadow:var(--shadow)}
.title-in:focus{outline:2px solid var(--orange)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);padding:5px;border-radius:16px}
.seg.s2{grid-template-columns:repeat(2,1fr)}.seg.s3{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:none;border-radius:12px;padding:9px 4px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--teal);color:#fff;font-weight:500}
.lbl{font-size:12px;color:var(--muted);margin-bottom:-6px}
.cl{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cl span{flex:1;min-width:0;overflow-wrap:anywhere}.cl.on span{text-decoration:line-through;color:var(--muted)}
.cl .rm{border:0;background:none;color:var(--muted);padding:4px}
.addrow{display:flex;gap:8px;margin-top:10px}.addrow .in{flex:1}
.up{border-left:3px solid var(--orange);padding:2px 0 2px 12px;margin-bottom:10px}
.up p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.up small{color:var(--muted);font-size:11.5px}
.note{font-size:12px;color:var(--muted)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0}
.sw button[aria-pressed=true]{border-color:var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-size:13px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.load{display:grid;place-items:center;min-height:70vh;color:var(--muted);text-align:center}
.ld-stage{position:relative;width:120px;height:120px;margin:0 auto 18px}
.ld-ring{position:absolute;inset:0}.ld-ring svg{width:100%;height:100%}
.ld-stage>.logo{position:absolute;left:12px;top:12px;width:96px;height:96px;box-shadow:none;opacity:.22}
.ld-fill{position:absolute;left:12px;bottom:12px;width:96px;height:0;overflow:hidden}
.ld-fill .logo{position:absolute;left:0;bottom:0;width:96px;height:96px;box-shadow:none}
.ld-text{display:inline-block;min-width:8ch;text-align:left;padding-left:1ch;font-weight:600;font-size:16px;color:var(--teal);letter-spacing:.02em}

/* ---------- layout system: one grid, one spacing scale ---------- */
.page{display:flex;flex-direction:column;gap:30px}
.blk{min-width:0}
.blk>.sec{margin:0 0 14px}
.hgrid{display:grid;gap:14px}
.hgrid.b{gap:30px}
.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sched.mas{display:flex;gap:12px;align-items:flex-start}.sched.mas>.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.sched.one{display:block}.sched.one>.sc{width:100%}
.sc .sc-ill{display:block;width:100%;max-width:150px;height:auto;margin:6px auto -10px}
.sc{min-height:112px}
.sc .tag{margin-top:auto}
.subs{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr}
.sb .bar{margin-top:auto}
.sb strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top{margin-bottom:24px}
.connect{max-width:540px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.connect h1{font:600 26px/1.25 Poppins,sans-serif;margin:0}.connect h1 em{font-style:normal;color:var(--orange2)}
.connect ol{margin:0;padding-left:20px;color:var(--muted);font-size:13px}
#nav .brand,#nav .lb,#nav .only-d{display:none}
.logo{width:52px;height:52px;flex:none;border-radius:50%;box-shadow:var(--shadow)}.logo svg{width:100%;height:100%}
.tools .logo{order:0}.tools .tl.a{order:-1}.tools .tl.z{order:1}
.tl{display:flex;flex-direction:column;align-items:center;gap:4px}.tl small{display:none;font-size:10.5px;color:var(--muted)}
body:has(#nav[hidden]){padding-left:0}
@media (min-width:600px){.subs{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
@media (min-width:900px){
  body{padding-left:248px}
  #app{max-width:1160px;margin:0;padding:36px 40px 64px}
  .top h1{font-size:30px}.top h1.plain{font-size:26px}
  .top.home{align-items:center}.top .tt{flex:1}.top.home .clocks{margin-right:8px}
  #nav{left:0;top:0;bottom:0;transform:none;width:248px;border-radius:0;box-shadow:none;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:30px 18px}
  #nav .brand{display:flex;align-items:center;gap:12px;order:-2;font:600 17px/1.25 Poppins,sans-serif;color:var(--teal);padding:0 8px 24px}
  #nav .brand .logo{width:48px;height:48px}
  .tools .logo{display:none}
  #nav .brand em{font-style:normal;color:var(--orange2)}
  #nav button{height:46px;display:flex;align-items:center;justify-content:flex-start;gap:14px;padding:0 14px;border-radius:14px;color:var(--muted);font-weight:500}
  #nav .lb{display:inline}#nav .only-d{display:flex}
  #nav button[aria-current=page]{background:var(--bg);color:var(--teal)}
  #nav button[aria-current=page]:after{display:none}
  #nav .fab{order:-1;width:100%;height:50px;border-radius:16px;margin:0 0 18px;justify-content:center;color:#fff;font-weight:600;box-shadow:0 10px 20px rgba(244,166,64,.3)}
  #toast{bottom:28px}
  .hgrid,.hgrid.b{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:28px;align-items:stretch}
  .hero{min-height:176px;padding:28px 30px}.hero h2{font-size:20px;max-width:20ch}
  .glance{grid-template-columns:1fr;grid-auto-rows:1fr}
  .pill{display:flex;align-items:center;gap:14px;padding:0 22px}.pill b{font-size:24px;min-width:36px}.pill span{font-size:13px}
  .chips{flex-wrap:wrap;overflow:visible}
  .calwrap{display:grid;grid-template-columns:400px minmax(0,1fr);gap:28px;align-items:start}
  .calwrap .sec:first-child{margin-top:0}
  .narrow{max-width:860px}
  .subs{grid-template-columns:repeat(4,minmax(0,1fr))}
  #ov{align-items:center}#sh{border-radius:28px;max-height:88vh}
}
/* phones and tablets: one centred column, card content centred */
@media (max-width:899px){
  #app{max-width:600px;margin:0 auto}
  .top{flex-direction:column;align-items:center;text-align:center;gap:14px}
  .top .tools{order:0}.top .tt{order:1}.top .clocks{order:2;justify-content:center}
  .greet .hi,.brief{justify-content:center}.clk{min-width:0;flex:1;max-width:190px;padding:12px 10px 10px}.clk .hm{font-size:26px}
  .seg.s3 button{font-size:12px}.runbar{text-align:left}
  .cdn span{min-width:0;flex:1}.cdn{width:100%}.cdn b{font-size:22px}
  .tools{gap:18px;align-items:flex-start}.tools .logo{width:60px;height:60px}
  .tl small{display:block}.tl .ic,.tl .av{width:46px;height:46px}
  .in,.title-in,.search input,select.in,textarea.in{font-size:16px}
  #nav{padding:6px 6px 8px}
  #nav button:not(.fab){height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  #nav button:not(.fab) .lb{display:block;font-size:10px;font-weight:500;line-height:1}
  #nav button.only-d{display:none}
  .subs{grid-auto-rows:auto}
  #nav button[aria-current=page]:after{display:none}
  .seg button{padding:11px 4px}.chip{padding:9px 14px}.x{width:42px;height:42px}
  .ck{width:30px;height:30px}.cl .rm{padding:9px}.btn.sm{padding:10px 16px}
  .dayb b{width:40px;height:40px}
  .sec button{background:var(--card);color:var(--teal);font-weight:500;border-radius:999px;padding:9px 18px;margin-top:6px;box-shadow:0 2px 8px rgba(35,79,95,.06)}
  .rb{min-height:44px;display:flex;flex-direction:column;justify-content:center}
  .sheetlink{display:inline-block;padding:12px 0}
  .top h1,.top h1.plain{max-width:none}
  .hero{flex-direction:column-reverse;text-align:center;gap:14px;padding:24px 20px}
  .hero-ill{width:130px;height:130px;margin:-6px 0}
  .hero h2{max-width:none;margin-bottom:12px}
  .hero small{margin:-6px 0 14px}
  .sec{flex-direction:column;align-items:center;gap:2px;text-align:center}
  .blk>.sec{margin-bottom:14px}
  .pill,.tile,.sc,.sb{text-align:center;align-items:center}
  .sc .tag{justify-content:center}
  .sb .bar{width:100%}
  .sb.add{grid-column:1/-1;min-height:64px}
  .grp h4{justify-content:center}
  .panel>strong{display:block;text-align:center}
  .legend{justify-content:center}
  .acts{justify-content:center}
  .connect{text-align:center}.connect ol{text-align:left}
}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}
  .hb{grid-template-columns:minmax(0,110px) minmax(0,1fr) auto}
}
@media (max-width:380px){.frow{grid-template-columns:1fr}.top h1{font-size:23px}}
@media (prefers-reduced-motion:no-preference){.sc,.sb,.pill,.chip,.btn{transition:transform .15s,background .15s}.sc:active,.sb:active,.pill:active{transform:scale(.98)}}
